server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 管理接口与 Mock 端点反向代理到后端
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /mock/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
