# 一条命令启动：docker compose up --build
services:
  backend:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_FILE: /data/store.json
    volumes:
      - mock-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mock-data:
